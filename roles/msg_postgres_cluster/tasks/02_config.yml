---
- name: Deploy customized performance optimization profile securely
  blockinfile:
    path: "/etc/postgresql/{{ db_version }}/main/postgresql.conf"
    marker: "# {mark} MSG PERFORMANCE OPTIMIZATION PROFILE"
    block: |
      max_connections = 150
      shared_buffers = 512MB
      effective_cache_size = 1GB
      maintenance_work_mem = 128MB
      work_mem = 8MB
      wal_level = replica
      max_wal_senders = 10
      wal_keep_size = 1024MB
      shared_preload_libraries = 'pg_stat_statements'
      pg_stat_statements.max = 10000
      pg_stat_statements.track = all
      logging_collector = on
      log_min_duration_statement = 200
  notify: Restart PostgreSQL

- name: Configure database engine to listen to target campus network interface
  lineinfile:
    path: "/etc/postgresql/{{ db_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Restrict incoming network traffic strictly to the regional subnet
  blockinfile:
    path: "/etc/postgresql/{{ db_version }}/main/pg_hba.conf"
    block: |
      host    replication     {{ vault_repl_user }}     {{ subnet_boundary }}        scram-sha-256
      host    all             all             {{ subnet_boundary }}        scram-sha-256
      host    all             all             127.0.0.1/32            scram-sha-256
  notify: Restart PostgreSQL

- name: Flush handlers to apply configuration adjustments immediately
  meta: flush_handlers

- name: Wait for PostgreSQL local UNIX socket to become active
  wait_for:
    path: "/var/run/postgresql/.s.PGSQL.5432"
    state: started
    timeout: 25
  when: inventory_hostname in groups['primary']
