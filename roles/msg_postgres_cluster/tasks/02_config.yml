---
- name: Configure database engine to listen to target campus network interface
  lineinfile:
    path: "/etc/postgresql/{{ db_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Restrict incoming network traffic strictly to the regional subnet
  blockinfile:
    path: "/etc/postgresql/{{ db_version }}/main/pg_hba.conf"
    block: |
      host    replication     {{ vault_repl_user }}     {{ subnet_boundary }}        scram-sha-256
      host    all             all             {{ subnet_boundary }}        scram-sha-256
      host    all             all             127.0.0.1/32            scram-sha-256
  notify: Restart PostgreSQL

- name: Relocate core OpenSSH server network listeners to secure custom port boundary
  lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: "^#?Port\\s+"
    line: "Port {{ custom_ssh_port }}"
  notify: Restart SSH

- name: Enforce modern Ubuntu systemd socket activation mappings for new SSH port 
  shell: |
    mkdir -p /etc/systemd/system/ssh.socket.d/
    cat << 'EOF' > /etc/systemd/system/ssh.socket.d/listen.conf
    [Socket]
    ListenStream=
    ListenStream={{ custom_ssh_port }}
    EOF
    systemctl daemon-reload
    systemctl restart ssh.socket || systemctl restart ssh
  args:
    executable: /bin/bash
  notify: Restart SSH

- name: Flush handlers to apply configuration adjustments immediately
  meta: flush_handlers
