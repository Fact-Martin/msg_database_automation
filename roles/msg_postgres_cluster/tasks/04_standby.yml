---
- name: Stop PostgreSQL daemon on Standby node to clear conflict locks
  service:
    name: postgresql
    state: stopped

- name: Purge Standby data directory completely to allow a clean clone
  file:
    path: "/var/lib/postgresql/{{ db_version }}/main"
    state: absent

- name: Execute high-speed basebackup stream cluster clone from Primary
  shell: |
    PGPASSWORD="{{ vault_repl_password }}" pg_basebackup -h {{ primary_ip }} -U {{ vault_repl_user }} -p {{ custom_db_port }} -D /var/lib/postgresql/{{ db_version }}/main -Fp -Xs -R
  become_user: postgres

- name: Force-inject explicit primary connection metadata into auto.conf
  blockinfile:
    path: "/var/lib/postgresql/{{ db_version }}/main/postgresql.auto.conf"
    marker: "# {mark} MSG STREAMING REPLICATION CONNECTION STRINGS"
    block: |
      primary_conninfo = 'host={{ primary_ip }} port={{ custom_db_port }} user={{ vault_repl_user }} password={{ vault_repl_password }} sslmode=prefer'
  become_user: postgres

- name: Guarantee the standby.signal marker file exists with correct ownership
  file:
    path: "/var/lib/postgresql/{{ db_version }}/main/standby.signal"
    state: touch
    owner: postgres
    group: postgres
    mode: '0600'

- name: Ensure hot standby transaction stream is active on Standby node
  lineinfile:
    path: "/etc/postgresql/{{ db_version }}/main/postgresql.conf"
    regexp: "^#?hot_standby\\s*="
    line: "listen_addresses = '*'\nhot_standby = on"

- name: Launch high-availability database cluster replication service
  service:
    name: postgresql
    state: started
