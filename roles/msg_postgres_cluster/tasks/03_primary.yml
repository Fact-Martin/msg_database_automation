---
- name: Force write configuration variables using PostgreSQL ALTER SYSTEM engine utilities
  shell: |
    set -o pipefail
    # Force inject shared preloads directly into the engine auto override files
    sudo -u postgres psql -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements', 'pgaudit';"
    sudo -u postgres psql -c "ALTER SYSTEM SET listen_addresses = '*';"
    
    # Force inject pgAudit session auditing criteria parameters
    sudo -u postgres psql -c "ALTER SYSTEM SET pgaudit.log = '{{ pgaudit_log_type }}';"
    sudo -u postgres psql -c "ALTER SYSTEM SET pgaudit.log_catalog = 'off';"
    sudo -u postgres psql -c "ALTER SYSTEM SET pgaudit.log_parameter = 'on';"
    sudo -u postgres psql -c "ALTER SYSTEM SET pgaudit.log_relation = 'on';"
    
    # Cycle the service deeply to clear memory maps and process allocations
    systemctl stop postgresql@16-main || true
    killall -9 postgres || true
    systemctl start postgresql@16-main
  args:
    executable: /bin/bash

- name: Wait for local Unix socket communication pathways to stabilize completely
  wait_for:
    path: "/var/run/postgresql/.s.PGSQL.5432"
    state: started
    timeout: 30

- name: Provision high-speed streaming replication service account
  postgresql_user:
    name: "{{ vault_repl_user }}"
    password: "{{ vault_repl_password }}"
    role_attr_flags: REPLICATION
  become_user: postgres

- name: Provision production administrative user account
  postgresql_user:
    name: "{{ vault_db_user }}"
    password: "{{ vault_db_password }}"
    role_attr_flags: SUPERUSER
  become_user: postgres

- name: Initialize primary institutional database instance
  postgresql_db:
    name: "{{ vault_db_name }}"
    owner: "{{ vault_db_user }}"
  become_user: postgres


- name: Build base student structures
  postgresql_query:
    login_db: "{{ vault_db_name }}"
    login_user: "{{ vault_db_user }}"
    login_password: "{{ vault_db_password }}"
    login_host: localhost
    query: |
      CREATE TABLE IF NOT EXISTS students (
          student_id SERIAL PRIMARY KEY,
          national_id VARCHAR(20) UNIQUE,
          first_name VARCHAR(50),
          last_name VARCHAR(50),
          campus VARCHAR(20)
      );

- name: Run safe relational migrations and schema expansion
  postgresql_query:
    login_db: "{{ vault_db_name }}"
    login_user: "{{ vault_db_user }}"
    login_password: "{{ vault_db_password }}"
    login_host: localhost
    query: |
      CREATE TABLE IF NOT EXISTS departments (
          department_id SERIAL PRIMARY KEY,
          department_name VARCHAR(100) NOT NULL UNIQUE,
          head_of_department VARCHAR(100)
      );
      CREATE TABLE IF NOT EXISTS staff (
          staff_id SERIAL PRIMARY KEY,
          national_id VARCHAR(20) UNIQUE NOT NULL,
          first_name VARCHAR(50) NOT NULL,
          last_name VARCHAR(50) NOT NULL,
          email VARCHAR(100) UNIQUE NOT NULL,
          department_id INT REFERENCES departments(department_id) ON DELETE SET NULL,
          job_title VARCHAR(50) NOT NULL
      );
      ALTER TABLE students ADD COLUMN IF NOT EXISTS year_of_study INT CHECK (year_of_study BETWEEN 1 AND 4);
      ALTER TABLE students ADD COLUMN IF NOT EXISTS department_id INT REFERENCES departments(department_id) ON DELETE RESTRICT;
      CREATE TABLE IF NOT EXISTS students_grades (
          grade_id SERIAL PRIMARY KEY,
          student_id INT REFERENCES students(student_id) ON DELETE CASCADE,
          course_code VARCHAR(10) NOT NULL,
          course_name VARCHAR(100) NOT NULL,
          numeric_grade INT CHECK (numeric_grade BETWEEN 0 AND 100),
          letter_grade VARCHAR(2),
          lecturer_id INT REFERENCES staff(staff_id) ON DELETE SET NULL
      );

- name: Optimize table execution path with performance indexing
  postgresql_idx:
    login_db: "{{ vault_db_name }}"
    login_user: "{{ vault_db_user }}"
    login_password: "{{ vault_db_password }}"
    login_host: localhost
    table: students
    idxname: idx_students_campus
    columns: campus
    state: present

- name: Optimize grades lookups with performance indexing
  postgresql_idx:
    login_db: "{{ vault_db_name }}"
    login_user: "{{ vault_db_user }}"
    login_password: "{{ vault_db_password }}"
    login_host: localhost
    table: students_grades
    idxname: idx_grades_student_id
    columns: student_id
    state: present

- name: Seed primary database instance with real institutional tuples and activate pgAudit
  postgresql_query:
    login_db: "{{ vault_db_name }}"
    login_user: "{{ vault_db_user }}"
    login_password: "{{ vault_db_password }}"
    login_host: localhost
    query: |
      -- Active pgAudit extension inside core catalogs
      CREATE EXTENSION IF NOT EXISTS pgaudit;
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

      -- Seed institutional data records
      INSERT INTO departments (department_name, head_of_department) VALUES
      ('Public Administration', 'Dr. J. Phiri'),
      ('Information Systems Management', 'Prof. E. Banda') ON CONFLICT (department_name) DO NOTHING;
      
      INSERT INTO staff (national_id, first_name, last_name, email, department_id, job_title) VALUES
      ('MW-ST-01', 'Grace', 'Chirwa', 'gchirwa@msg.ac.mw', 2, 'Senior Lecturer') ON CONFLICT (national_id) DO NOTHING;
      
      INSERT INTO students (national_id, first_name, last_name, campus) VALUES
      ('MW-BL-101', 'Chikondi', 'Phiri', 'Mpemba'),
      ('MW-LL-102', 'Limbani', 'Banda', 'Kanengo'),
      ('MW-BL-103', 'Tiame', 'Kumwenda', 'Mpemba') ON CONFLICT (national_id) DO NOTHING;
      
      UPDATE students SET department_id = 1, year_of_study = 3 WHERE national_id = 'MW-BL-101';
      UPDATE students SET department_id = 2, year_of_study = 2 WHERE national_id = 'MW-LL-102';
      UPDATE students SET department_id = 1, year_of_study = 1 WHERE national_id = 'MW-BL-103';
      
      INSERT INTO students_grades (student_id, course_code, course_name, numeric_grade, letter_grade, lecturer_id) VALUES
      (1, 'PAS3101', 'Public Policy Analysis', 78, 'A', 1),
      (2, 'ISM2102', 'Database Systems Management', 85, 'A', 1) ON CONFLICT DO NOTHING;


- name: Verify backup storage target destination directory exists
  file:
    path: "/var/backups/postgres"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Deploy secure non-chained logical database backup execution script
  template:
    src: pg_backup.sh.j2
    dest: /usr/local/bin/pg_backup.sh
    owner: postgres
    group: postgres
    mode: '0755'

- name: Schedule cron job execution window for nightly automated backups
  cron:
    name: "Execute nightly database backup schedule sequence"
    minute: "0"
    hour: "1"
    user: postgres
    job: "/usr/local/bin/pg_backup.sh"

